name: Public Site Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check browser JavaScript syntax
        run: |
          node --check app.js
          node --check math.js
          node --check classroom/classroom.js
          node --check classroom/world/world.js
          node --check classroom/auth/auth-core.js
          node --check classroom/auth/status-world.js
          node --check classroom/login/login.js
          node --check classroom/student/student.js
          node --check --input-type=module < logic/truth-table.js
          node --check logic/logic-engine.mjs
          node --check --input-type=module < logic/practice.js
          node --check logic/practice-engine.mjs
      - name: Validate only approved public content and static shell
        run: |
          node tests/validate-public-catalog.mjs
          node tests/classroom.test.mjs
          node tests/classroom-world.test.mjs
          node tests/classroom-auth.test.mjs
          node tests/student-auth.test.mjs
      - name: Verify Truth Table Lab mathematical engine and page safety
        run: |
          node tests/truth-table.test.mjs
          node tests/practice.test.mjs
