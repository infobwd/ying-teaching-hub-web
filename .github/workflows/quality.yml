name: Public Site Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check browser JavaScript syntax
        run: |
          node --check app.js
          node --check math.js
          node --check logic/truth-table.js
          node --check logic/logic-engine.mjs
      - name: Validate only approved public content and static shell
        run: node tests/validate-public-catalog.mjs
      - name: Verify Truth Table Lab mathematical engine and page safety
        run: node tests/truth-table.test.mjs
